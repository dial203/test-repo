[project]
name = "nocturne-sync"
version = "0.1.0"
description = "Ingest and query API for Apple Health data collected from study participants"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
nocturne-admin = "nocturne_sync.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
